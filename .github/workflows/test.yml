name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile logic27_patch.py test_core.py
      - run: python test_core.py
